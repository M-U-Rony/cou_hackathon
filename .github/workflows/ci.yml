name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  python-tests:
    name: Python Pipeline & Modeling Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run pytest
        run: python -m pytest -v

  dashboard-checks:
    name: Dashboard Tests, Typecheck & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run Vitest unit tests
        run: npm test

      - name: Typecheck TypeScript
        run: npx tsc -p tsconfig.app.json --noEmit

      - name: Lint with oxlint
        run: npm run lint

      - name: Build production bundle
        run: npm run build

  docker-build:
    name: Docker Production Build & Smoke Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t fairprice-bd:ci .

      - name: Smoke test container endpoints
        run: |
          docker run -d --rm --name fp-ci -p 3000:3000 fairprice-bd:ci
          trap 'docker stop fp-ci >/dev/null 2>&1 || true' EXIT
          sleep 2
          curl -fsS http://127.0.0.1:3000/api/health
          curl -fsS http://127.0.0.1:3000/ >/dev/null
          curl -fsS http://127.0.0.1:3000/landing.html >/dev/null
          curl -fsS http://127.0.0.1:3000/login.html >/dev/null
